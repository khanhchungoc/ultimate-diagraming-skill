      <div id="swimlanes-container">
        <!-- SVG Connections Overlay -->
        <svg id="connector-svg">
          <defs>
            <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7.2" refY="4" orient="auto">
              <polygon points="0 1, 7.5 4, 0 7" style="fill:var(--connector)"/>
            </marker>
            <marker id="arrowhead-selected" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto">
              <polygon points="0 0.75, 5.6 3, 0 5.25" style="fill:var(--primary)"/>
            </marker>
            <marker id="arrowhead-in" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto">
              <polygon points="0 0.75, 5.6 3, 0 5.25" style="fill:var(--edge-in)"/>
            </marker>
            <marker id="arrowhead-out" markerWidth="6" markerHeight="6" refX="5.4" refY="3" orient="auto">
              <polygon points="0 0.75, 5.6 3, 0 5.25" style="fill:var(--edge-out)"/>
            </marker>
          </defs>
          <g id="edge-group"></g>
          <path id="drag-edge" d="" style="display:none; fill:none; stroke:var(--primary); stroke-width:3px; stroke-dasharray: 6 6; pointer-events:none;"/>
        </svg>

        <!-- HTML Edge Labels Container -->
        <div id="edge-labels-group" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:30;"></div>

        <!-- Swimlane Rows will be rendered here -->
        <div id="lanes-root"></div>
        <div id="lane-drop-line"></div>
        <div id="snap-guide-v" class="snap-guide snap-guide-v"></div>
        <div id="snap-guide-h" class="snap-guide snap-guide-h"></div>
        <div id="insert-hint" data-export-skip aria-hidden="true">+ Insert step</div>
      </div>
