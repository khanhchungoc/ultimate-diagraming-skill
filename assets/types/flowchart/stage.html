      <div id="swimlanes-container">
        <!-- SVG Connections Overlay -->
        <svg id="connector-svg">
          <defs>
            <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
              <polyline points="1.5 1.5, 8.5 5, 1.5 8.5" style="fill:none;stroke:var(--connector);stroke-width:1.4px;stroke-linecap:round;stroke-linejoin:round"/>
            </marker>
            <marker id="arrowhead-selected" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
              <polyline points="1.5 1.5, 8.5 5, 1.5 8.5" style="fill:none;stroke:var(--primary);stroke-width:2px;stroke-linecap:round;stroke-linejoin:round"/>
            </marker>
            <marker id="arrowhead-in" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
              <polyline points="1.5 1.5, 8.5 5, 1.5 8.5" style="fill:none;stroke:var(--edge-in);stroke-width:2px;stroke-linecap:round;stroke-linejoin:round"/>
            </marker>
            <marker id="arrowhead-out" markerWidth="10" markerHeight="10" refX="8.5" refY="5" orient="auto" markerUnits="userSpaceOnUse">
              <polyline points="1.5 1.5, 8.5 5, 1.5 8.5" style="fill:none;stroke:var(--edge-out);stroke-width:2px;stroke-linecap:round;stroke-linejoin:round"/>
            </marker>
          </defs>
          <!-- Dashed leaders from each visible note to its node (under the nodes, so they stop at the node's edge) -->
          <g id="note-leader-group"></g>
          <g id="edge-group"></g>
          <path id="drag-edge" d="" style="display:none; fill:none; stroke:var(--primary); stroke-width:3px; stroke-dasharray: 6 6; pointer-events:none;"/>
        </svg>

        <!-- HTML Edge Labels Container -->
        <div id="edge-labels-group" style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:30;"></div>

        <!-- Swimlane Rows will be rendered here -->
        <div id="lanes-root"></div>
        <!-- Node notes: free-floating cards above the diagram, fitted into gaps near their node (see renderNotes) -->
        <div id="notes-layer" class="note-layer"></div>
        <div id="lane-drop-line"></div>
        <div id="snap-guide-v" class="snap-guide snap-guide-v"></div>
        <div id="snap-guide-h" class="snap-guide snap-guide-h"></div>
        <div id="insert-hint" data-export-skip aria-hidden="true">+ Insert step</div>
      </div>
