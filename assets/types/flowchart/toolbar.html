      <!-- Shapes popover: hover (or click / tap) the trigger, then click a tile or drag it onto the canvas.
           Tiles are grouped in labelled .dock-pop-section blocks (Flow, Classic, Annotate), each tile captioned.
           To add a shape, add one more .btn-shape tile with its data-node-type to a section; the grid wraps on its own.
           The last tile, Note, attaches a note to a step rather than adding a node. -->
      <div class="dock-pop-wrap" data-dock-pop>
        <button id="btn-add-shape" class="btn dock-pop-trigger" aria-label="Shapes" aria-haspopup="true" aria-expanded="false" aria-controls="shape-pop">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="13" width="8" height="8" rx="1.5"/><circle cx="17" cy="17" r="4"/><path d="M12 3 7.5 10h9z"/></svg><span class="btn-label">Shapes</span>
          <svg class="dock-pop-caret" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 15 6-6 6 6"/></svg>
        </button>
        <div id="shape-pop" class="dock-pop" role="group" aria-label="Shapes: click to add, or drag onto the canvas">
          <div class="dock-pop-section">
            <div class="dock-pop-heading" aria-hidden="true">Flow</div>
            <div class="dock-pop-grid" role="group" aria-label="Flow">
              <button id="btn-add-start" class="btn btn-shape" data-node-type="start" title="Start (click, or drag onto the canvas)" aria-label="Start">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="5"/></svg><span class="tile-caption">Start</span>
              </button>
              <button id="btn-add-end" class="btn btn-shape" data-node-type="end" title="End (click, or drag onto the canvas)" aria-label="End">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="5"/></svg><span class="tile-caption">End</span>
              </button>
              <button id="btn-add-step" class="btn btn-shape" data-node-type="task" title="Step (click, or drag onto the canvas or onto an arrow)" aria-label="Step">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="12" rx="2.5"/></svg><span class="tile-caption">Step</span>
              </button>
              <button id="btn-add-decision" class="btn btn-shape" data-node-type="decision" title="Decision (click, or drag onto the canvas or onto an arrow)" aria-label="Decision">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 12l10 9 10-9z"/></svg><span class="tile-caption">Decision</span>
              </button>
              <!-- Not a node of its own: a connector pair replaces an arrow (no data-node-type; see the CONNECTOR TOOL in flowchart.js) -->
              <button id="btn-add-connector" class="btn btn-shape btn-connector-tool" title="Connector: drag onto an arrow to break it into a lettered pair (or click to split the selected arrow)" aria-label="Connector">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="tile-line" d="M0.5 12H2M22 12h1.5"/><path class="tile-line tile-gap" d="M10.5 12h3" stroke-dasharray="1 2"/><circle cx="6" cy="12" r="4"/><circle cx="18" cy="12" r="4"/></svg><span class="tile-caption">Connector</span>
              </button>
            </div>
          </div>
          <div class="dock-pop-section">
            <div class="dock-pop-heading" aria-hidden="true">Classic</div>
            <div class="dock-pop-grid" role="group" aria-label="Classic">
              <button id="btn-add-subprocess" class="btn btn-shape" data-node-type="subprocess" title="Subprocess: a process documented elsewhere (click, or drag onto the canvas or onto an arrow)" aria-label="Subprocess">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="1"/><path class="tile-line" d="M5.5 6v12M18.5 6v12"/></svg><span class="tile-caption">Subprocess</span>
              </button>
              <button id="btn-add-io" class="btn btn-shape" data-node-type="io" title="Data: input or output (click, or drag onto the canvas or onto an arrow)" aria-label="Data">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h16l-4 12H2z"/></svg><span class="tile-caption">Data</span>
              </button>
              <button id="btn-add-document" class="btn btn-shape" data-node-type="document" title="Document (click, or drag onto the canvas or onto an arrow)" aria-label="Document">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 5h18v11c-3-1.6-6-1.6-9 0s-6 1.6-9 0z"/></svg><span class="tile-caption">Document</span>
              </button>
              <button id="btn-add-database" class="btn btn-shape" data-node-type="database" title="Database: stored data (click, or drag onto the canvas or onto an arrow)" aria-label="Database">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6.5a8 2.5 0 0 1 16 0v11a8 2.5 0 0 1-16 0z"/><path class="tile-line" d="M4 6.5a8 2.5 0 0 0 16 0"/></svg><span class="tile-caption">Database</span>
              </button>
              <button id="btn-add-delay" class="btn btn-shape" data-node-type="delay" title="Delay: a wait (click, or drag onto the canvas or onto an arrow)" aria-label="Delay">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h11a6 6 0 0 1 0 12H3z"/></svg><span class="tile-caption">Delay</span>
              </button>
            </div>
          </div>
          <div class="dock-pop-section">
            <div class="dock-pop-heading" aria-hidden="true">Annotate</div>
            <div class="dock-pop-grid" role="group" aria-label="Annotate">
              <!-- Not a shape of its own: a note belongs to a step (no data-node-type; see the NOTE TOOL in flowchart.js) -->
              <button id="btn-add-note" class="btn btn-shape btn-note-tool" title="Note (drag onto a step, or click to add one to the selected step)" aria-label="Note">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="note-paper" d="M4 5h16v10l-5 5H4z"/><path class="note-fold" d="M20 15h-5v5"/><path class="note-lines" d="M7.5 9.5h9M7.5 13h6"/></svg><span class="tile-caption">Note</span>
              </button>
            </div>
          </div>
        </div>
      </div>
      <button id="btn-add-lane" class="btn" title="Add a swimlane" aria-label="Lane">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 12h18"/></svg><span class="btn-label">Lane</span>
      </button>
      <button id="btn-notes" class="btn" title="Show all notes" aria-label="Notes" aria-pressed="false">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15.5 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.5z"/><path d="M15 3v5a1 1 0 0 0 1 1h5"/><path d="M7 13h7"/><path d="M7 17h4"/></svg><span class="btn-label">Notes</span><span class="btn-count" hidden></span>
      </button>
      <button id="btn-direction"class="btn" data-dock-group="layout" title="Switch to a top-to-bottom layout" aria-label="Vertical">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v18"/><path d="m7 16 5 5 5-5"/></svg><span class="btn-label">Vertical</span>
      </button>
      <!-- Auto-Tidy on/off (see AUTO LAYOUT in flowchart.js), a sliding switch; the shell places it just before Tidy -->
      <button id="btn-auto-layout" class="btn btn-switch" role="switch" data-dock-group="layout" title="Auto-Tidy is on: the diagram re-arranges itself after every step edit (click to place steps by hand)" aria-label="Auto-Tidy" aria-checked="true">
        <span class="switch-track" aria-hidden="true"><span class="switch-knob"></span></span><span class="btn-label">Auto-Tidy</span>
      </button>
