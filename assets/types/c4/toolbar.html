      <!-- Add popover: click a tile to add the item (one added while a group is selected joins that group); its name opens for editing -->
      <div class="dock-pop-wrap" data-dock-pop>
        <button id="btn-add" class="btn dock-pop-trigger" aria-label="Add" aria-haspopup="true" aria-expanded="false" aria-controls="c4-pop">
          {{icon:plus}}<span class="btn-label">Add</span>
          <span class="dock-pop-caret" aria-hidden="true">{{icon:chevron-up:xs:bold}}</span>
        </button>
        <div id="c4-pop" class="dock-pop" role="group" aria-label="Add: click to add">
          <div class="dock-pop-section">
            <div class="dock-pop-heading" aria-hidden="true">Landscape</div>
            <div class="dock-pop-grid" role="group" aria-label="Landscape">
              <button id="btn-add-person" class="btn btn-shape" title="Person: someone who uses the system (click to add)" aria-label="Person">
                <span class="c4-tile-card" aria-hidden="true"><span class="c4-tile-disc">{{icon:user:md}}</span></span><span class="tile-caption">Person</span>
              </button>
              <button id="btn-add-system" class="btn btn-shape" title="Software system: something that delivers value, shown as one box (click to add)" aria-label="Software system">
                <span class="c4-tile-card" aria-hidden="true"><span class="c4-tile-disc">{{icon:server:md}}</span></span><span class="tile-caption">System</span>
              </button>
              <button id="btn-add-external" class="btn btn-shape" title="External system: a third-party system you do not own (click to add)" aria-label="External system">
                <span class="c4-tile-card" aria-hidden="true"><span class="c4-tile-disc">{{icon:cloud:md}}</span></span><span class="tile-caption">External</span>
              </button>
              <button id="btn-add-group" class="btn btn-shape" title="Group: a frame around elements; select one first to add into it (click to add)" aria-label="Group">
                {{icon:shape-c4-group:tile:fine}}<span class="tile-caption">Group</span>
              </button>
            </div>
          </div>
          <div class="dock-pop-section">
            <div class="dock-pop-heading" aria-hidden="true">Inside a system</div>
            <div class="dock-pop-grid" role="group" aria-label="Inside a system">
              <button id="btn-add-container" class="btn btn-shape" title="Container: an app, service or data store inside a system (click to add)" aria-label="Container">
                <span class="c4-tile-card" aria-hidden="true"><span class="c4-tile-disc">{{icon:container:md}}</span></span><span class="tile-caption">Container</span>
              </button>
              <button id="btn-add-database" class="btn btn-shape" title="Database: a data store (click to add)" aria-label="Database">
                <span class="c4-tile-card" aria-hidden="true"><span class="c4-tile-disc">{{icon:database:md}}</span></span><span class="tile-caption">Database</span>
              </button>
              <button id="btn-add-queue" class="btn btn-shape" title="Queue: a message broker or topic (click to add)" aria-label="Queue">
                <span class="c4-tile-card" aria-hidden="true"><span class="c4-tile-disc">{{icon:queue:md}}</span></span><span class="tile-caption">Queue</span>
              </button>
            </div>
          </div>
          <div class="dock-pop-section">
            <div class="dock-pop-heading" aria-hidden="true">Annotate</div>
            <div class="dock-pop-grid" role="group" aria-label="Annotate">
              <button id="btn-add-note" class="btn btn-shape btn-note-tool" title="Note: select an element, group or arrow first, then click to add a note to it" aria-label="Note">
                {{icon:note:tile:fine}}<span class="tile-caption">Note</span>
              </button>
            </div>
          </div>
        </div>
      </div>

      <span class="dock-sep" aria-hidden="true"></span>
      <!-- Level (c4.js, LEVEL): Level N opens the groups down to N - 1 system levels (Level 1: collapsible systems are one box) and collapses the rest -->
      <div class="dock-pop-wrap" data-dock-pop data-level>
        <button id="btn-level" class="btn dock-pop-trigger" aria-label="Level" aria-haspopup="true" aria-expanded="false" aria-controls="level-pop">
          {{icon:layers}}<span class="btn-label">Level</span><span class="btn-count" hidden></span>
          <span class="dock-pop-caret" aria-hidden="true">{{icon:chevron-up:xs:bold}}</span>
        </button>
        <div id="level-pop" class="dock-pop" role="radiogroup" aria-label="C4 level">
          <div class="dock-pop-grid">
            <button type="button" id="btn-level-1" class="btn btn-shape" role="radio" data-level="1" aria-checked="false" title="Level 1, system context: systems are shown as one box" aria-label="Level 1, system context">
              {{icon:server:tile:fine}}<span class="tile-caption">Level 1</span>
            </button>
            <button type="button" id="btn-level-2" class="btn btn-shape" role="radio" data-level="2" aria-checked="false" title="Level 2, containers: systems are opened to their containers" aria-label="Level 2, containers">
              {{icon:type-c4:tile:fine}}<span class="tile-caption">Level 2</span>
            </button>
          </div>
        </div>
      </div>
      <span class="dock-sep" aria-hidden="true"></span>
      <!-- Notes (c4.js, NOTES): shows or hides every note card; the count is the notes with text -->
      <button id="btn-notes" class="btn btn-switch" role="switch" title="Show all notes" aria-label="Notes" aria-checked="false">
        {{icon:notes}}<span class="btn-label">Notes</span><span class="btn-count" hidden></span>
      </button>
