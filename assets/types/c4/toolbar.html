      <!-- Level (c4.js, LEVEL): Level N opens the groups down to N - 1 system levels (Level 1: every system is one box) and collapses the rest -->
      <button id="btn-level-1" class="btn" data-level="1" aria-pressed="false" title="Level 1, system context: every system is one box" aria-label="Level 1">
        {{icon:layers}}<span class="btn-label">Level 1</span>
      </button>
      <button id="btn-level-2" class="btn" data-level="2" aria-pressed="false" title="Level 2, containers: systems are opened to their containers" aria-label="Level 2">
        {{icon:layers}}<span class="btn-label">Level 2</span>
      </button>
