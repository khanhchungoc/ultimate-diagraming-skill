  <!-- Find: a small field floating over the canvas, so the canvas never shifts -->
  <div class="uc-search" role="search">
    {{icon:search:sm}}
    <input id="uc-search" type="search" placeholder="Find a use case or requirement (/)" aria-label="Find a use case, actor or requirement id" autocomplete="off" spellcheck="false">
    <span id="uc-search-count" class="t-caption" aria-live="polite"></span>
    <button id="uc-search-fit" class="btn" title="Zoom to the matches" aria-label="Fit to matches" hidden>Fit to matches</button>
    <button id="uc-search-clear" class="btn btn-icon" title="Clear the search (Esc)" aria-label="Clear the search" hidden>{{icon:close:xs}}</button>
  </div>
