      <button id="btn-add-participant" class="btn" title="Add a participant at the right end" aria-label="Participant">
        {{icon:participant}}<span class="btn-label">Participant</span>
      </button>
      <button id="btn-add-message" class="btn" title="Add a message after the selected one" aria-label="Message">
        {{icon:message}}<span class="btn-label">Message</span>
      </button>
      <button id="btn-frame" class="btn" title="Wrap the selected messages in a frame" aria-label="Frame">
        {{icon:frame}}<span class="btn-label">Frame</span>
      </button>
      <button id="btn-add-note" class="btn" title="Add a note to the selected message or participant" aria-label="Note">
        {{icon:note}}<span class="btn-label">Note</span>
      </button>
      <span class="dock-sep" aria-hidden="true"></span>
      <button id="btn-numbers" class="btn" title="Number every message" aria-label="Numbers" aria-pressed="false">
        {{icon:numbers}}<span class="btn-label">Numbers</span>
      </button>
      <button id="btn-details" class="btn" title="Show each message's detail under its arrow" aria-label="Details" aria-pressed="false">
        {{icon:message-return}}<span class="btn-label">Details</span>
      </button>
      <button id="btn-lifespans" class="btn" title="Trim lifelines: each one runs only from its participant's first message to its last" aria-label="Trim lifelines" aria-pressed="false">
        {{icon:lifespans}}<span class="btn-label">Trim lifelines</span>
      </button>
      <button id="btn-show-all" class="btn" title="Expand every collapsed frame" aria-label="Show all" hidden>
        {{icon:eye}}<span class="btn-label">Show all</span>
      </button>
