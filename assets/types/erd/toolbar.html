      <!-- Editing tools (see EDITING in erd.js) -->
      <div class="dock-pop-wrap" data-dock-pop>
        <button id="btn-add" class="btn dock-pop-trigger" aria-label="Add" aria-haspopup="true" aria-expanded="false" aria-controls="erd-pop">
          {{icon:plus}}<span class="btn-label">Add</span>
          <span class="dock-pop-caret" aria-hidden="true">{{icon:chevron-up:xs:bold}}</span>
        </button>
        <div id="erd-pop" class="dock-pop" role="group" aria-label="Add: click to add, or drag onto the canvas">
          <div class="dock-pop-grid" role="group" aria-label="Add">
            <button id="btn-add-table" class="btn btn-shape" title="Add a table after the selected one, or drag this onto the canvas" aria-label="Table">
              {{icon:table-add:tile:fine}}<span class="tile-caption">Table</span>
            </button>
            <button id="btn-add-note" class="btn btn-shape btn-note-tool" title="Add a note to the selected table (N), or drag this onto a table" aria-label="Note">
              {{icon:note:tile:fine}}<span class="tile-caption">Note</span>
            </button>
          </div>
        </div>
      </div>
      <span class="dock-sep" aria-hidden="true"></span>
      <!-- What is shown -->
      <!-- Columns: one of three views, so a choice from a popover (a radio group), not a button that cycles. Types below is a plain on/off switch. -->
      <div class="dock-pop-wrap" data-dock-pop data-dock-priority="7">
        <button id="btn-columns" class="btn dock-pop-trigger" aria-label="Columns" aria-haspopup="true" aria-expanded="false" aria-controls="columns-pop">
          {{icon:columns}}<span class="btn-label">Columns</span><span class="btn-count">All</span>
          <span class="dock-pop-caret" aria-hidden="true">{{icon:chevron-up:xs:bold}}</span>
        </button>
        <div id="columns-pop" class="dock-pop" role="radiogroup" aria-label="Columns shown">
          <div class="dock-pop-grid">
            <button type="button" class="btn btn-shape" role="radio" data-detail="all" aria-checked="true" title="Every column" aria-label="All columns">
              {{icon:columns:tile:fine}}<span class="tile-caption">All</span>
            </button>
            <button type="button" class="btn btn-shape" role="radio" data-detail="keys" aria-checked="false" title="Only the key columns" aria-label="Key columns only">
              {{icon:key:tile:fine}}<span class="tile-caption">Keys</span>
            </button>
            <button type="button" class="btn btn-shape" role="radio" data-detail="names" aria-checked="false" title="Table names only" aria-label="Table names only">
              {{icon:type-erd:tile:fine}}<span class="tile-caption">Names</span>
            </button>
          </div>
        </div>
      </div>
      <button id="btn-types" class="btn btn-switch" role="switch" data-dock-priority="8" title="Show or hide the column types" aria-label="Types" aria-checked="true">
        {{icon:types}}<span class="btn-label">Types</span>
      </button>
      <button id="btn-notes" class="btn btn-switch" role="switch" title="Show all notes" aria-label="Notes" aria-checked="false">
        {{icon:notes}}<span class="btn-label">Notes</span><span class="btn-count" hidden></span>
      </button>
