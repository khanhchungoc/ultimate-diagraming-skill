      <!-- Editing tools (see EDITING in erd.js) -->
      <button id="btn-add-table" class="btn" title="Add a table after the selected one, or drag this onto the canvas" aria-label="Table">
        {{icon:table-add}}<span class="btn-label">Table</span>
      </button>
      <button id="btn-add-relationship" class="btn" title="Relationship: click, then drag from a column of one table to another table (or drag from a hovered column's dot)" aria-label="Relationship">
        {{icon:relationship}}<span class="btn-label">Relationship</span>
      </button>
      <button id="btn-add-note" class="btn" title="Add a note to the selected table (N), or drag this onto a table" aria-label="Note">
        {{icon:note}}<span class="btn-label">Note</span>
      </button>
      <span class="dock-sep" aria-hidden="true"></span>
      <!-- What is shown -->
      <button id="btn-columns" class="btn" title="Columns: all. Click to show only key columns" aria-label="Columns">
        {{icon:columns}}<span class="btn-label">Columns</span><span class="btn-count btn-label">All</span>
      </button>
      <button id="btn-types" class="btn" title="Show or hide the column types" aria-label="Types" aria-pressed="true">
        {{icon:types}}<span class="btn-label">Types</span>
      </button>
      <button id="btn-notes" class="btn" title="Show all notes" aria-label="Notes" aria-pressed="false">
        {{icon:notes}}<span class="btn-label">Notes</span><span class="btn-count" hidden></span>
      </button>
