<!DOCTYPE html>
<!-- For agents: the whole diagram is the JSON (application/json) in the "diagram-data" script on lines 0-0 of this file. Read lines 1-0 only (offset 1, limit 0); everything after line 0 is editor code (CSS, JS, icons) and says nothing about the diagram.
     The model's first key, "_readme", says how to read it. The "end diagram-data" comment marks the true end: if it is not on the line named above (the JSON was edited by hand since the last save), trust the comment. To print just the model:
     sed -n '/<script id="diagram-data" type="application\/json">/,/<\/script>/p' FILE
     python -c "import re,sys;print(re.search(r'<script id=\"diagram-data\" type=\"application\/json\">(.*?)<\/script>',open(sys.argv[1],encoding='utf8').read(),re.S)[1])" FILE -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <!-- Diagram model: the source of truth for this page. Everything after this block is the editor. -->
  <script id="diagram-data" type="application/json">
{{DATA}}
  </script>
  <!-- end diagram-data -->{{THEME}}
  <!-- Nunito Sans from Google Fonts (the only network request). Offline it fails fast and the page uses the
       system fallback in shell.css; label fitting measures whichever font is in use. A blocking stylesheet on
       purpose: the @font-face rules exist before the main script runs, so its fonts.ready re-render still fires. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{FONT_HREF}}">
  <style>
{{TOKENS_CSS}}
{{COMPONENTS_CSS}}
{{SHELL_CSS}}
{{TYPE_CSS}}
  </style>
</head>
<body>

  <!-- Top Toolbar -->
  <header>
    <div class="toolbar-left">
      {{TYPE_ICON}}
      <div class="app-title-container">
        <h1 id="chart-title" contenteditable="false" spellcheck="false" title="Double-click to rename diagram">{{PAGE_TITLE}}</h1>
        <span id="save-status" class="badge badge-status">Ready</span>
      </div>
    </div>

    <div class="toolbar-right">
      <button id="btn-search" class="btn btn-icon" title="Search (Ctrl+F or /)" aria-label="Search" aria-expanded="false" aria-controls="search-bar" hidden>
        {{icon:search}}
      </button>
      <button id="btn-undo" class="btn btn-icon" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        {{icon:undo}}
      </button>
      <button id="btn-redo" class="btn btn-icon" title="Redo (Ctrl+Y / Ctrl+Shift+Z)" aria-label="Redo" disabled>
        {{icon:redo}}
      </button>
      <button id="btn-theme" class="btn btn-icon" title="Switch to dark mode" aria-label="Switch to dark mode"></button>
      <button id="btn-help" class="btn btn-icon" title="Keyboard shortcuts" aria-label="Keyboard shortcuts" aria-expanded="false" aria-controls="help-drawer">?</button>
      <button id="btn-present" class="btn" title="Present: a read-only view (Esc exits)" aria-label="Present" aria-pressed="false">
        {{icon:present}}<span class="btn-label">Present</span>
      </button>
      <div class="menu-wrap">
        <button id="btn-export" class="btn" title="Download or copy the diagram as an image" aria-label="Export" aria-haspopup="menu" aria-expanded="false">
          {{icon:export}}<span class="btn-label">Export</span>
        </button>
        <div id="export-menu" class="menu" role="menu" hidden>
          <div class="menu-label" role="presentation">Download</div>
          <button type="button" role="menuitem" data-export="svg">SVG image</button>
          <button type="button" role="menuitem" data-export="png">PNG image (1.5x)</button>
          <div class="menu-label" role="presentation" data-copy-label>Copy</div>
          <button type="button" role="menuitem" data-copy="mermaid">Mermaid</button>
          <button type="button" role="menuitem" data-copy="svg">SVG (text)</button>
          <button type="button" role="menuitem" data-copy="png">PNG image (1.5x)</button>
          <div class="menu-label" role="presentation" data-import-label>Import</div>
          <button type="button" role="menuitem" data-import="mermaid">Mermaid text&hellip;</button>
        </div>
      </div>
      <button id="btn-save" class="btn btn-primary" title="Save directly into this HTML file (Ctrl+S)" aria-label="Save">
        {{icon:save}}<span class="btn-label">Save</span>
      </button>
    </div>
    <!-- Text search: opened by #btn-search, Ctrl/Cmd+F or "/" (shell.js, SEARCH); inside the header so it hangs just below it -->
    <div id="search-bar" role="search" hidden>
      <input id="search-input" type="search" placeholder="Search" aria-label="Search the diagram" autocomplete="off" spellcheck="false">
      <span id="search-count" role="status" aria-live="polite"></span>
      <button id="search-prev" class="btn btn-icon" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>{{icon:chevron-up}}</button>
      <button id="search-next" class="btn btn-icon" type="button" title="Next match (Enter)" aria-label="Next match" disabled>{{icon:chevron-down}}</button>
      <button id="search-close" class="btn btn-icon" type="button" title="Close (Esc)" aria-label="Close search">{{icon:close}}</button>
    </div>
  </header>

  <!-- Add controls: a floating dock at the bottom of the viewport, styled like the zoom dock -->
  <div class="dock-area">
  <div class="toolbar-center" role="toolbar" aria-label="Edit the diagram">
{{TYPE_TOOLBAR}}
      <!-- Shown only while something is selected (plugin.hasSelection) -->
      <button id="btn-delete-selection" class="btn dock-delete" title="Delete the selection (Delete key)" aria-label="Delete selection" aria-hidden="true" tabindex="-1">
        {{icon:trash}}<span class="btn-label">Delete</span>
      </button>
      <!-- Layout controls: type buttons marked data-dock-group="layout" are moved here, before Tidy -->
      <span class="dock-sep" aria-hidden="true"></span>
      <button id="btn-auto-tidy" class="btn" title="Tidy: re-align and lay out the whole diagram now" aria-label="Tidy">
        {{icon:tidy}}<span class="btn-label">Tidy</span>
      </button>
  </div>

  <!-- Zoom controls: floating in the bottom-left corner of the viewport -->
  <div class="toolbar-zoom" role="group" aria-label="Zoom">
    <button id="btn-zoom-out" class="btn btn-icon" title="Zoom out" aria-label="Zoom out">
      {{icon:minus}}
    </button>
    <span id="zoom-level">100%</span>
    <button id="btn-zoom-in" class="btn btn-icon" title="Zoom in" aria-label="Zoom in">
      {{icon:plus}}
    </button>
    <button id="btn-zoom-reset" class="btn" title="Fit to screen">Fit</button>
  </div>
  </div>

{{TYPE_CHROME}}

  <!-- Viewport for Pan and Zoom -->
  <div id="viewport">
    <div id="stage">
{{TYPE_STAGE}}
    </div>
  </div>

  <!-- Help & Shortcuts Drawer -->
  <aside id="help-drawer" role="dialog" aria-labelledby="help-title">
    <div class="help-head">
      <span id="help-title">Shortcuts &amp; Interaction</span>
      <button id="help-close" class="help-close" type="button" title="Close (Esc)" aria-label="Close shortcuts">
        {{icon:close}}
      </button>
    </div>
    <ul class="help-list">
{{TYPE_HELP}}
{{SHELL_HELP}}
    </ul>
  </aside>

  <!-- Interactive Diagram Script: shell, then the type's engine and plugin -->
  <script>
    (function () {
      'use strict';

{{TOKENS_JS}}
{{SHELL_JS}}
//@engine-begin
{{ENGINE_JS}}
//@engine-end
{{MERMAID_JS}}
{{TYPE_JS}}
      loadInitialData();
    })();
  </script>
</body>
</html>
