<!DOCTYPE html>
<!-- For agents: the whole diagram is the JSON (application/json) in the "diagram-data" script on lines 0-0 of this file. Read lines 1-0 only (offset 1, limit 0); everything after line 0 is editor code (CSS, JS, icons) and says nothing about the diagram.
     The model's first key, "_readme", says how to read it. The "end diagram-data" comment marks the true end: if it is not on the line named above (the JSON was edited by hand since the last save), trust the comment. To print just the model:
     sed -n '/<script id="diagram-data" type="application\/json">/,/<\/script>/p' FILE
     python -c "import re,sys;print(re.search(r'<script id=\"diagram-data\" type=\"application\/json\">(.*?)<\/script>',open(sys.argv[1],encoding='utf8').read(),re.S)[1])" FILE -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <!-- The theme is set before the first paint (priority: ?theme=dark|light, then the saved choice, then the OS), so a page never flashes the other theme. shell.js reads it back. -->
  <script>(function () { var t = null; try { t = new URLSearchParams(location.search).get('theme'); } catch (e) {} if (t !== 'dark' && t !== 'light') { try { t = localStorage.getItem('flowchart-theme'); } catch (e) {} } if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; document.documentElement.setAttribute('data-theme', t); })();</script>
  <title>{{PAGE_TITLE}}</title>
  <!-- Diagram model: the source of truth for this page. Everything after this block is the editor. -->
  <script id="diagram-data" type="application/json">
{{DATA}}
  </script>
  <!-- end diagram-data -->{{THEME}}
  <!-- Nunito Sans from Google Fonts (the only network request). Offline it fails fast and the page uses the
       system fallback in shell.css; label fitting measures whichever font is in use. A blocking stylesheet on
       purpose: the @font-face rules exist before the main script runs, so its fonts.ready re-render still fires. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="{{FONT_HREF}}">
  <style>
{{TOKENS_CSS}}
{{COMPONENTS_CSS}}
{{SHELL_CSS}}
{{TYPE_CSS}}
  </style>
</head>
<body>
  <div id="sr-announcer" class="visually-hidden" role="status" aria-live="polite" data-export-skip></div>

  <!-- Top Floating Corner Pills -->
  <header>
    <div class="toolbar-left">
      {{TYPE_ICON}}
      <div class="app-title-container">
        <h1 id="chart-title" contenteditable="false" spellcheck="false" title="Double-click to rename diagram">{{PAGE_TITLE}}</h1>
        <span id="save-status" class="badge badge-status">Ready</span>
      </div>
    </div>

    <div class="toolbar-right" role="toolbar" aria-label="Diagram actions">
      <button id="btn-search" class="btn btn-icon" title="Search (Ctrl+F or /)" aria-label="Search" aria-expanded="false" aria-controls="search-bar" hidden>
        {{icon:search}}
      </button>
      <button id="btn-theme" class="btn btn-icon pill-secondary" title="Dark mode" aria-label="Dark mode" aria-pressed="false">
        <span class="theme-moon">{{icon:moon}}</span><span class="theme-sun">{{icon:sun}}</span>
      </button>
      <button id="btn-help" class="btn btn-icon pill-secondary" title="Keyboard shortcuts (?)" aria-label="Keyboard shortcuts" aria-expanded="false">
        {{icon:help}}
      </button>
      <span class="toolbar-sep" aria-hidden="true"></span>
      <button id="btn-present" class="btn" title="Present: a read-only view (Esc exits)" aria-label="Present" aria-pressed="false">
        {{icon:present}}<span class="btn-label">Present</span>
      </button>
      <button id="btn-import-mermaid" class="btn btn-icon pill-secondary" title="Import: replace the diagram from pasted Mermaid text (Ctrl+V on the canvas does the same)" aria-label="Import Mermaid" hidden>
        {{icon:import}}
      </button>
      <div class="menu-wrap pill-secondary">
        <button id="btn-export" class="btn btn-icon" title="Export: download or copy the diagram as an image" aria-label="Export" aria-haspopup="menu" aria-expanded="false">
          {{icon:export}}
        </button>
        <div id="export-menu" class="menu" role="menu" aria-labelledby="btn-export" hidden>
          <div class="menu-label" role="presentation">Download</div>
          <button type="button" role="menuitem" data-export="svg">SVG image</button>
          <button type="button" role="menuitem" data-export="png">PNG image (1.5x)</button>
          <button type="button" role="menuitem" data-export="svg-all" hidden>SVG images, every tab</button>
          <div class="menu-label" role="presentation" data-copy-label>Copy</div>
          <button type="button" role="menuitem" data-copy="mermaid">Mermaid</button>
          <button type="button" role="menuitem" data-copy="svg">SVG (text)</button>
          <button type="button" role="menuitem" data-copy="png">PNG image (1.5x)</button>
        </div>
      </div>
      <div class="menu-wrap more-wrap">
        <button id="btn-more" class="btn btn-icon" title="More actions" aria-label="More actions" aria-haspopup="menu" aria-expanded="false" aria-controls="more-menu">
          {{icon:more}}
        </button>
        <div id="more-menu" class="menu" role="menu" aria-labelledby="btn-more" hidden></div>
      </div>
      <button id="btn-save" class="btn btn-primary" title="Save directly into this HTML file (Ctrl+S)" aria-label="Save">
        {{icon:save}}<span class="btn-label">Save</span>
      </button>
    </div>
  </header>

  <!-- Text search bar, opening beneath the top-right pill (#btn-search, Ctrl/Cmd+F or "/"; shell.js, SEARCH) -->
  <div id="search-dock">
    <div id="search-bar" role="search" hidden>
      <span class="search-glyph" aria-hidden="true">{{icon:search}}</span>
      <input id="search-input" type="search" placeholder="Search" aria-label="Search the diagram" autocomplete="off" spellcheck="false">
      <span id="search-count" role="status" aria-live="polite"></span>
      <button id="search-prev" class="btn btn-icon" type="button" title="Previous match (Shift+Enter)" aria-label="Previous match" disabled>{{icon:chevron-up}}</button>
      <button id="search-next" class="btn btn-icon" type="button" title="Next match (Enter)" aria-label="Next match" disabled>{{icon:chevron-down}}</button>
    </div>
  </div>

  <!-- Add controls: a floating dock at the bottom of the viewport, styled like the zoom dock -->
  <div class="dock-area">
  <div class="toolbar-center" role="toolbar" aria-label="Edit the diagram">
{{TYPE_TOOLBAR}}
      <!-- Shown only while something is selected (plugin.hasSelection) -->
      <button id="btn-delete-selection" class="btn dock-delete" title="Delete the selection (Delete key)" aria-label="Delete selection" aria-hidden="true" tabindex="-1">
        {{icon:trash}}<span class="btn-label">Delete</span>
      </button>
      <!-- Layout controls: type buttons marked data-dock-group="layout" are moved here, before Tidy -->
      <span class="dock-sep" aria-hidden="true"></span>
      <button id="btn-auto-tidy" class="btn" title="Tidy: re-align and lay out the whole diagram now" aria-label="Tidy">
        {{icon:tidy}}<span class="btn-label">Tidy</span>
      </button>
  </div>

  <!-- Zoom controls: floating in the bottom-left corner of the viewport -->
  <div class="toolbar-zoom" role="group" aria-label="View">
    <button id="btn-undo" class="btn btn-icon" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
      {{icon:undo}}
    </button>
    <button id="btn-redo" class="btn btn-icon" title="Redo (Ctrl+Y / Ctrl+Shift+Z)" aria-label="Redo" disabled>
      {{icon:redo}}
    </button>
    <span class="dock-sep" aria-hidden="true"></span>
    <button id="btn-zoom-reset" class="btn btn-icon" title="Fit to screen" aria-label="Fit to screen">
      {{icon:fit}}
    </button>
  </div>
  </div>

{{TYPE_CHROME}}

  <!-- Viewport for Pan and Zoom -->
  <div id="viewport">
    <div id="page-loading" role="status" aria-label="Loading"></div>
    <div id="stage">
{{TYPE_STAGE}}
    </div>
    <div id="actionbar-layer" data-export-skip></div>
  </div>

  <!-- Standalone HTML save guide modal (shown before OS file browser when saving a local HTML file) -->
  <dialog id="save-modal" class="save-modal" closedby="any" aria-labelledby="save-modal-title" data-export-skip>
    <h1 id="save-modal-title" class="save-modal-title">Save over this file</h1>
    <p id="save-modal-msg" class="save-modal-msg"></p>
    <code id="save-modal-path" class="save-where" hidden></code>
    <label class="save-modal-check">
      <input id="save-modal-skip" type="checkbox">
      <span>Don’t show this again</span>
    </label>
    <form method="dialog" class="confirm-actions">
      <button type="submit" value="cancel" class="btn">Cancel</button>
      <button type="submit" value="continue" class="btn btn-primary" autofocus>Continue</button>
    </form>
  </dialog>

  <!-- Help & Shortcuts Popover (Built with Ultimate Diagram: {{REPO_URL}}) -->
  <aside id="help-drawer" role="dialog" aria-labelledby="help-title">
    <div class="help-head">
      <span id="help-title">Shortcuts</span>
      <button id="help-close" class="help-close" type="button" title="Close (Esc)" aria-label="Close shortcuts">
        {{icon:close}}
      </button>
    </div>
    <div class="help-body">
{{TYPE_HELP}}
{{SHELL_HELP}}
    </div>
    <div class="help-foot">
      <span class="help-credit">Ultimate Diagram</span>
      <a class="help-repo" href="{{REPO_URL}}" target="_blank" rel="noopener noreferrer">
        {{icon:code:sm}}<span>GitHub</span><span class="visually-hidden"> ({{REPO_NAME}}, opens in a new tab)</span>
      </a>
    </div>
  </aside>

  <!-- Interactive Diagram Script: shell, then the type's engine and plugin -->
  <script>
    (function () {
      'use strict';

{{TOKENS_JS}}
{{SHELL_JS}}
//@engine-begin
{{ENGINE_JS}}
//@engine-end
{{MERMAID_JS}}
{{TYPE_JS}}
      loadInitialData();
    })();
  </script>
</body>
</html>
