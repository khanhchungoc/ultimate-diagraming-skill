name: artifacts

# Republish the claude.ai Artifacts (playground + README examples) when the code or data they are built from changes.
# claude.ai has no publish API: only the Artifact tool inside a Claude Code session can publish, so this runs Claude Code
# headlessly (claude-code-action) and asks it to rebuild and republish each artifact to its existing URL.
# Setup: add the repository secret CLAUDE_CODE_OAUTH_TOKEN (run `claude setup-token` locally while logged in to the claude.ai
# account that owns the artifacts; only the owner can update them).
on:
  push:
    branches: [main]
    paths:
      - assets/**
      - scripts/**
      - dev/examples/**
      - dev/playground/**
      - dev/tools/build_playground.py
      - dev/tools/build_examples.py
      - .github/workflows/artifacts.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: artifacts
  cancel-in-progress: true

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: --allowedTools "Artifact,Bash,Read,Write"
          prompt: |
            Republish these claude.ai Artifacts to their existing URLs (action "publish" with `url`, after the `read` that
            references/artifacts.md describes). Build everything in a scratch directory, never in the workspace.

            - Playground https://claude.ai/artifact/Ny25B5E4ts4TramawB4BQp: `python dev/tools/build_playground.py -o <scratch>/playground`,
              then publish `<scratch>/playground/index.html` with `files` mapping every other file in that folder.
            - Examples, one artifact each: build the split files with `assemble_artifact(kind, data)` from scripts/layout_engine.py,
              where `data` is the laid-out model (see `build()` in dev/tools/build_examples.py), then publish as in references/artifacts.md.
              - dev/examples/example-flowchart.json -> https://claude.ai/artifact/4GXf3ufVkqEMR9BNy7UuWE
              - dev/examples/example-sequence.json -> https://claude.ai/artifact/5GAHnbS8tb9bxKxAi4JDYz
              - dev/examples/example-erd.json -> https://claude.ai/artifact/39Vy8dhSEdN4MjqVe1qQEv
              - dev/examples/example-usecase.json -> https://claude.ai/artifact/DyGtj4nxA7nvkmjdfcFddG

            Skip an artifact whose built files are identical to what is live. Fail loudly if any publish is refused.
