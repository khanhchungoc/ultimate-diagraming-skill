name: release

# Auto-release when a PR from stg is merged into main, or run manually
# (via GitHub Actions UI or `gh workflow run release.yml`):
# bump the patch version, commit it, tag it, publish a release zip and npm package.
on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: 'Release notes (leave blank to auto-generate from PRs/commits)'
        required: false
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.ref == 'stg' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
      - name: Bump, commit, and tag
        id: v
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main --tags
            git reset --hard origin/main
            if git log -1 --pretty=%s | grep -qF '[skip ci]'; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Release the committed version as-is if it has no tag yet; otherwise bump past any existing tags.
            while git rev-parse -q --verify "refs/tags/v$(python3 dev/tools/release.py version)" >/dev/null; do
              python3 dev/tools/release.py bump
            done
            VER="$(python3 dev/tools/release.py version)"
            git add package.json package-lock.json SKILL.md
            git diff --cached --quiet || git commit -m "Release v${VER} [skip ci]"
            git tag "v${VER}"
            # Atomic push ensures the commit on main and the tag either both land or both fail.
            if git push --atomic origin HEAD:main "v${VER}"; then
              echo "version=${VER}" >> "$GITHUB_OUTPUT"
              echo "skip=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git tag -d "v${VER}" || true
          done
          echo "Failed to push release commit and tag after 3 attempts" >&2
          exit 1
      - name: Build zip
        if: steps.v.outputs.skip != 'true'
        run: python3 dev/tools/release.py zip
      - name: Publish release
        if: steps.v.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          if [ -n "$RELEASE_NOTES" ]; then
            gh release create "v${{ steps.v.outputs.version }}" \
              "ultimate-diagram-v${{ steps.v.outputs.version }}.zip" \
              --title "v${{ steps.v.outputs.version }}" --notes "$RELEASE_NOTES"
          else
            gh release create "v${{ steps.v.outputs.version }}" \
              "ultimate-diagram-v${{ steps.v.outputs.version }}.zip" \
              --title "v${{ steps.v.outputs.version }}" --generate-notes
          fi
      - name: Setup Node
        if: steps.v.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - name: Publish to npm
        if: steps.v.outputs.skip != 'true'
        run: npm publish --provenance --access public
      - name: Sync release commit back to stg
        if: steps.v.outputs.skip != 'true'
        run: |
          if git ls-remote --exit-code --heads origin stg >/dev/null 2>&1; then
            git fetch origin main stg
            git checkout -B stg origin/stg
            if git merge --no-edit origin/main -m "Sync release v${{ steps.v.outputs.version }} into stg [skip ci]"; then
              git push origin stg
            else
              git merge --abort || true
              echo "::warning::Could not auto-sync v${{ steps.v.outputs.version }} into stg; merge origin/main into stg manually."
            fi
          else
            git fetch origin main
            git push origin origin/main:refs/heads/stg
          fi
