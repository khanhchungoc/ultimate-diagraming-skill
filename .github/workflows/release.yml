name: release

# Every push to main: bump the patch version, commit it, tag it, publish a release zip.
on:
  push:
    branches: [main]
    # Only changes to what users install. README, dev/, docs/, .github/ and agent notes do not release.
    paths:
      - SKILL.md
      - package.json
      - assets/**
      - references/**
      - scripts/**
      - bin/**

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The bump commit below carries [skip ci]; this guard is a second stop against loops.
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bump version
        id: v
        run: |
          # Release the committed version as-is if it has no tag yet; otherwise bump patch.
          if git rev-parse -q --verify "refs/tags/v$(python3 dev/release.py version)" >/dev/null; then
            python3 dev/release.py bump
          fi
          echo "version=$(python3 dev/release.py version)" >> "$GITHUB_OUTPUT"
      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json SKILL.md
          git diff --cached --quiet || git commit -m "Release v${{ steps.v.outputs.version }} [skip ci]"
          git tag "v${{ steps.v.outputs.version }}"
          # Lightweight tag: name it explicitly (--follow-tags only pushes annotated tags).
          git push origin HEAD:main "v${{ steps.v.outputs.version }}"
      - name: Build zip
        run: python3 dev/release.py zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            "ultimate-diagram-v${{ steps.v.outputs.version }}.zip" \
            --title "v${{ steps.v.outputs.version }}" --generate-notes
