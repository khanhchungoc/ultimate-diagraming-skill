name: playground

# Build the blank playground (every diagram type) and publish it to GitHub Pages on every push to main that changes what a page runs.
on:
  push:
    branches: [main]
    paths:
      - assets/**
      - scripts/**
      - dev/tools/build_playground.py
      - .github/workflows/playground.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python dev/tools/build_playground.py -o _site
      # Gate: a build that does not load every type in a real browser never deploys.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node dev/tests/e2e/e2e_playground.mjs --dir _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
