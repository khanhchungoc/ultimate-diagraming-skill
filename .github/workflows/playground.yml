name: playground

# Build the playground (every diagram type) and every example page, and publish them to GitHub Pages on every push to main
# (a merged PR) that changes what a page runs or what an example is built from.
on:
  push:
    branches: [main]
    paths:
      - assets/**
      - scripts/**
      - dev/tools/build_playground.py
      - dev/tools/build_examples.py
      - dev/examples/**
      - dev/playground/**
      - .github/workflows/playground.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python dev/tools/build_playground.py -o _site
      # One page per example at examples/<name>/, plus examples/index.html linking them.
      - run: |
          python dev/tools/build_examples.py
          mkdir -p _site/examples
          for f in dev/samples/example-*.html; do
            n=$(basename "$f" .html); n=${n#example-}
            mkdir -p "_site/examples/$n"; cp "$f" "_site/examples/$n/index.html"
          done
          { echo '<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagram examples</title><h1>Diagram examples</h1><ul>'
            for d in _site/examples/*/; do n=$(basename "$d"); echo "<li><a href=\"$n/\">$n</a></li>"; done
            echo '</ul>'; } > _site/examples/index.html
      # Gate: a build that does not load every type in a real browser never deploys.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - run: node dev/tests/e2e/e2e_playground.mjs --dir _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
